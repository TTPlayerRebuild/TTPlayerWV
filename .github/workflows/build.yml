name: Build WavPack plugin
run-name: WavPack x86 Release - ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      only_if_unreleased:
        description: Skip when the commit is already released
        type: boolean
        default: false
      release_a_version:
        description: Publish a GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.release_a_version && 'manual-wv-release' || format('manual-wv-build-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  release_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY_IF_UNRELEASED: ${{ inputs.only_if_unreleased }}
          RELEASE_REQUESTED: ${{ inputs.release_a_version }}
        run: python3 cmake/check_component_release.py
  build:
    needs: release_check
    if: needs.release_check.outputs.should_build == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUESTED: ${{ inputs.release_a_version }}
        run: ./cmake/resolve_release_version.ps1 -Repository $env:GITHUB_REPOSITORY -ReleaseRequested:($env:RELEASE_REQUESTED -eq 'true')
      - name: Build, audit imports and package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build.ps1 -Package -SourcePackage -PackageVersion $env:PACKAGE_VERSION
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item -Path "build/Release/ttp_wv-$env:PACKAGE_VERSION*.zip",'build/Release/SHA256SUMS.txt' -Destination artifact
      - uses: actions/upload-artifact@v7
        with:
          name: ttp_wv-x86-Release-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
  github_release:
    needs: build
    if: inputs.release_a_version
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      PREVIOUS_VERSION: ${{ needs.build.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ttp_wv-x86-Release-${{ github.run_number }}
          path: artifact
      - name: Verify artifacts and prepare notes
        run: ./cmake/prepare_release.ps1 -Version $env:RELEASE_VERSION -PreviousVersion $env:PREVIOUS_VERSION -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -ServerUrl $env:GITHUB_SERVER_URL
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_VERSION" "artifact/ttp_wv-$env:RELEASE_VERSION.zip" "artifact/ttp_wv-$env:RELEASE_VERSION-source.zip" artifact/SHA256SUMS.txt `
            --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "$env:RELEASE_VERSION" --notes-file artifact/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release failed; existing releases are not overwritten.' }
